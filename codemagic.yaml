workflows:
  theos-dylib-build:
    name: "YTMusicUltimate Theos dylib (P9 fix)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "16.2"
    scripts:
      - name: Install Theos + ldid
        script: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Install ldid (Theos signing tool) - required for dylib signing step
          brew install ldid 2>&1 || true
          # Fallback: grab ldid binary directly from Procursus if brew fails
          if ! command -v ldid &>/dev/null; then
            curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64" \
              -o /usr/local/bin/ldid && chmod +x /usr/local/bin/ldid || true
          fi
          ldid 2>&1 | head -2 || echo "ldid available: $(which ldid 2>/dev/null || echo 'NOT FOUND')"

      - name: Show available iOS SDKs
        script: |
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build the dylib
        script: |
          set -e
          export THEOS="$HOME/theos"
          # Pin Makefile TARGET to whatever SDK the runner ships (avoids "SDK 16.5 not found")
          perl -pi -e 's/iphone:clang:16\.5:13\.0/iphone:clang:latest:13.0/g' Makefile
          make clean >/dev/null 2>&1 || true
          make DEBUG=0 FINALPACKAGE=1 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Locate + verify dylib (P9 selector check)
        script: |
          set -e
          mkdir -p /tmp/artifacts
          # Theos outputs final dylib to .theos/obj/ (signed) or packages/
          find . -name 'YTMusicUltimate.dylib' 2>/dev/null | tee /tmp/dylibs.txt
          test -s /tmp/dylibs.txt || { echo "NO DYLIB PRODUCED"; exit 1; }
          # Use the first found (prefer packages/ over obj/ if both present)
          DYLIB=$(grep -E 'packages|\.dylib$' /tmp/dylibs.txt | head -1 || head -1 /tmp/dylibs.txt)
          cp "$DYLIB" /tmp/artifacts/YTMusicUltimate.dylib
          echo "Using dylib: $DYLIB ($(du -h "$DYLIB" | cut -f1))"
          echo "contentPlayerResponse (fixed) count: $(strings /tmp/artifacts/YTMusicUltimate.dylib | grep -c contentPlayerResponse || true)"
          echo "playerResponse        (buggy) count:  $(strings /tmp/artifacts/YTMusicUltimate.dylib | grep -cx playerResponse || true)"
          echo "SELECTOR CHECK: $(strings /tmp/artifacts/YTMusicUltimate.dylib | grep -c contentPlayerResponse) contentPlayerResponse hit(s)"
          # Fail the build if the fix selector is absent
          strings /tmp/artifacts/YTMusicUltimate.dylib | grep -q contentPlayerResponse || { echo "FAIL: contentPlayerResponse not in dylib"; exit 1; }
          echo "PASS: contentPlayerResponse confirmed in dylib"

      - name: Copy build log
        script: |
          cp /tmp/build.log /tmp/artifacts/build.log || true

    artifacts:
      - /tmp/artifacts/YTMusicUltimate.dylib
      - /tmp/artifacts/build.log
